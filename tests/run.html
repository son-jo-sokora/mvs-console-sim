<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>シミュレータのテスト</title>
<style>
:root { --bg: #11151a; --panel: #1a2027; --line: #2f3a46; --text: #d7dee6; --muted: #8b98a6; --ok: #4cc38a; --bad: #ff6b6b; --accent: #5fb3ff; --mono: "Cascadia Mono", Consolas, monospace; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.6 "Yu Gothic UI", "Meiryo", system-ui, sans-serif; }
main { max-width: 1000px; margin: 0 auto; padding: 16px; }
h1 { font-size: 18px; } a { color: var(--accent); }
.sum { font-size: 16px; font-weight: 600; padding: 10px 14px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line); }
.sum.ok { border-color: #2d6a4f; color: var(--ok); } .sum.ng { border-color: #7a2e2e; color: var(--bad); }
.cov { color: var(--muted); font-size: 13px; margin: 8px 0 16px; }
details { border-bottom: 1px solid var(--line); padding: 4px 0; }
summary { cursor: pointer; } .m { display: inline-block; width: 1.3em; } .ok .m { color: var(--ok); } .ng .m { color: var(--bad); }
.id { font-family: var(--mono); color: var(--muted); margin-right: 6px; } .kind { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 0 6px; margin-right: 6px; }
.err { color: var(--bad); font-size: 13px; margin: 4px 0 0 1.6em; }
pre { background: #050805; color: #4fe36b; font: 12px/1.4 var(--mono); padding: 8px; border-radius: 4px; white-space: pre-wrap; margin: 6px 0 6px 1.6em; }
</style>
</head>
<body>
<main>
  <h1>MVS IPL シミュレータのテスト <a href="../index.html" style="font-size:13px">← シミュレータへ</a></h1>
  <p class="cov">エラー一覧（<a href="../docs/error-catalog.md">docs/error-catalog.md</a>）の各ケースと、手順例（procedures.html）の全手順をシミュレータで実行して確認します。各行を開くとコンソールの出力が見られます。</p>
  <div id="sum" class="sum">実行中…</div>
  <div id="cov" class="cov"></div>
  <div id="list"></div>
</main>
<script src="../engine.js"></script>
<script src="../msgref.js"></script>
<script src="../procedures.js"></script>
<script src="cases.js"></script>
<script src="runner.js"></script>
<script>
(async () => {
  const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
  let src = null;
  try { src = await (await fetch('../engine.js')).text(); } catch (e) { /* file:// では読めない。網羅性チェックは省略 */ }
  const { results, coverage } = MvsTestRunner.runAll({ Sim: MvsSim, Ref: MvsRef, Procs: MvsProcs, cases: MvsCases, engineSrc: src });
  const pass = results.filter(r => r.ok).length, fail = results.length - pass;
  const sum = document.getElementById('sum');
  sum.textContent = `${results.length} 件中 ${pass} 件成功 / ${fail} 件失敗` + (coverage && coverage.problems ? ` / 網羅性の問題 ${coverage.problems} 件` : '');
  sum.className = 'sum ' + (fail || (coverage && coverage.problems) ? 'ng' : 'ok');
  document.getElementById('cov').textContent = coverage
    ? `網羅性: シミュレータが出すメッセージ ID ${coverage.ids} 種類のうち ${coverage.idsSeen} 種類、待機状態コード ${coverage.waits} 種類のうち ${coverage.waitsSeen} 種類がテストに出現。` + (coverage.notSeen.concat(coverage.waitNotSeen, coverage.noRef, coverage.waitNoRef).length ? ' 問題: ' + coverage.notSeen.concat(coverage.waitNotSeen, coverage.noRef, coverage.waitNoRef).join(', ') : '')
    : '（ファイルを直接開いているため、網羅性チェックは省略しました）';
  document.getElementById('list').innerHTML = results.map(r =>
    `<details class="${r.ok ? 'ok' : 'ng'}" ${r.ok ? '' : 'open'}><summary><span class="m">${r.ok ? '✓' : '✗'}</span><span class="kind">${r.kind}</span><span class="id">${r.id}</span>${esc(r.title)}</summary>` +
    r.errs.map(e => `<div class="err">${esc(e)}</div>`).join('') + `<pre>${esc(r.text.join('\n'))}</pre></details>`).join('');
})();
</script>
</body>
</html>
